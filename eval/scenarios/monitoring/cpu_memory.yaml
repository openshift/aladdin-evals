# CPU and Memory Monitoring Tests
# Tests focused on CPU and memory resource monitoring

- conversation_group_id: test_cluster_cpu_usage
  description: Test querying cluster CPU usage
  tag: monitoring

  conversation_metrics: []
  conversation_metrics_metadata: {}

  turns:
    - turn_id: turn_1
      query: "show me cpu usage of my cluster in table"
      expected_response: |
        Here is the CPU usage of your cluster showing node CPU usage 
        and pod CPU usage with metrics.
      expected_tool_calls:
        - - tool_name: mcp_list_tools
            arguments:
              server_label: obs
        - - tool_name: mcp_list_tools
            arguments:
              server_label: kube
        - - tool_name: mcp_list_tools
            arguments:
              server_label: ngui
        - - tool_name: nodes_top
            arguments:
              server_label: kube
        - - tool_name: generate_ui_component
            arguments:
              user_prompt: show me cpu usage.*
              data: ".*"
              data_type: nodes_top
              server_label: ngui
      turn_metrics:
        - ragas:response_relevancy
        - custom:answer_correctness
        - custom:tool_eval

